name: Build Chunk Finder 1.21.11
on:
  push:
    branches: [chunkfinder-build-1-21-11]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chunkfinder-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: ChunkFinder-Fabric-1.21.11-JAR
          path: chunkfinder-fabric/build/libs/chunkfinder-fabric-1.21.11-1.0.0.jar
          if-no-files-found: error
