name: Build Amethyst Glow 1.21.11
on:
  push:
    branches: [amethyst-glow-build-1-21-11]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amethyst-glow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Minecraft mod
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AmethystGlow-Fabric-1.21.11-JAR
          path: amethyst-glow/build/libs/amethyst-glow-fabric-1.21.11-1.0.0.jar
          if-no-files-found: error
